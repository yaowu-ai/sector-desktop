name: release-desktop

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag name
        required: true
        default: v0.1.0-test.1
      prerelease:
        description: Mark release as prerelease
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        shell: bash
        env:
          WORKFLOW_TAG_NAME: ${{ inputs.tag_name }}
          WORKFLOW_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${WORKFLOW_TAG_NAME}" ]]; then
            echo "tag_name=${WORKFLOW_TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${WORKFLOW_PRERELEASE}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          cache-dependency-path: desktop/pnpm-lock.yaml
          package-json-file: desktop/package.json
          install: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        shell: pwsh
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt
      - name: Build Windows installer
        shell: pwsh
        run: .\desktop-build.ps1 -Python "python" -BuildMode production
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          cache-dependency-path: desktop/pnpm-lock.yaml
          package-json-file: desktop/package.json
          install: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip pyinstaller -r requirements.txt
      - name: Build macOS arm64 installer
        env:
          PYTHON_BIN: python3
          BUILD_MODE: production
        run: bash ./desktop-build-macos.sh
      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          cache-dependency-path: desktop/pnpm-lock.yaml
          package-json-file: desktop/package.json
          install: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip pyinstaller -r requirements.txt
      - name: Build macOS x64 installer
        env:
          PYTHON_BIN: python3
          BUILD_MODE: production
        run: bash ./desktop-build-macos-x64.sh
      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-x64
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - build-windows
      - build-macos-arm64
      - build-macos-x64
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          files: release-assets/**/*
